name: Deploy StudyBeam to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate navigation pages for deployment
        run: python3 scripts/build_navigation_pages.py
      - name: Test Dreamy Pastel landing page
        run: python3 -m unittest discover -s tests -p 'test_dreamy_landing.py' -v
      - name: Test StudyBeam calendar v2
        run: node tests/test_calendar_v2.cjs
      - name: Test dashboard Pastel Dream
        run: node tests/test_dashboard_v2.cjs
      - name: Audit local routes and assets
        run: python3 scripts/audit_site.py
      - name: Commercial release safety gate
        run: python3 scripts/audit_commercial.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public routes (catch 404 after deploy)
        shell: bash
        run: |
          set -euo pipefail
          SITE="${{ steps.deployment.outputs.page_url }}"
          for route in index.html fonctionnalites.html contact.html calendrier.html mes-notes.html beam-3d-apercu.html mentions-legales.html conditions-utilisation.html confidentialite.html conditions-vente.html statut-ouverture.html; do
            echo "Checking ${SITE}${route}"
            curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-delay 4 \
              "${SITE}${route}?check=${{ github.sha }}" -o /tmp/studybeam-page.html
            grep -qi '<html' /tmp/studybeam-page.html
          done
