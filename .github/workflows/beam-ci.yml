name: Validate Beam companion
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Beam JavaScript
        run: |
          node --check planner-data.js
          node --check planner-dashboard.js
          node --check school-backup.js
          node --check school-tools.js
          node --check beam-live.js
          node --check beam-3d.js
          node --check beam-global.js
          node --check beam-study-guide.js
          node --check navigation.js
          node --check beam-assistant.js
          node --check beam-customizer.js
          node --check demo.js
      - name: Test planner calculations
        run: node tests/test-planner.js
      - name: Test safe school backups
        run: node tests/test-school-backup.cjs
      - name: Test guided Beam and source videos
        run: node tests/test-study-guide.cjs
      - name: Verify static-page generation
        run: |
          python3 scripts/build_navigation_pages.py
          python3 scripts/build_navigation_pages.py --check
      - name: Audit local routes and assets
        run: python3 scripts/audit_site.py
      - name: Commercial release safety gate
        run: python3 scripts/audit_commercial.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium smoke-test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check commercial pages, mobile navigation and signup in Chromium
        run: python tests/test-commercial-browser.py
