<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modération des vidéos — StudyBeam</title><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./design.css?v=video-admin-1"><style>main{max-width:1000px;margin:35px auto;padding:20px}.video-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.video-admin-grid label{display:flex;flex-direction:column;gap:4px}.video-admin-grid input,.video-admin-grid select,.video-admin-grid textarea{width:100%;padding:9px;border:1px solid #ccd;border-radius:8px}.video-admin-item{padding:16px;margin:12px 0;border:1px solid #DDE6E6;border-radius:12px;background:#fff}.video-admin-item .row{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}</style></head><body><main><p><a href="./videos.html">← Retour aux vidéos</a></p><h1>Modération des vidéos StudyBeam</h1><p>Accès réservé aux administrateurs. Les suggestions non validées ne sont jamais publiées.</p><p id="adminStatus" role="status">Vérification de ton compte…</p><div id="adminPanel" class="hidden"><h2>Ajouter une référence</h2><form id="adminVideoForm"><div class="video-admin-grid"><label>Titre<input name="title" required maxlength="250"></label><label>URL HTTPS<input name="url" type="url" required></label><label>Chaîne<input name="channel" required></label><label>Durée (secondes)<input name="duration_seconds" type="number" min="0" max="43200"></label><label>Classe<input name="grade" required placeholder="ex. 6e"></label><label>Voie<input name="pathway" required placeholder="ex. commun"></label><label>ID matière<input name="subject_id" required></label><label>ID chapitre<input name="chapter_id" required></label><label>Langue<input name="language" value="fr" required></label><label>Source<input name="source" placeholder="YouTube, Lumni…" required></label></div><label>Description<textarea name="description" rows="3" required></textarea></label><button class="btn" type="submit">Ajouter pour vérification</button></form><h2>Références à modérer</h2><button class="btn ghost" id="refreshVideos">Actualiser</button><div id="adminVideos"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="./supabase-config.js"></script><script src="./video-admin.js?v=1"></script></body></html>
